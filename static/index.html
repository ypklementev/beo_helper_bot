<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Оформить заявку</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <form id="order-form" class="form">
    <h1 class="title">Оформить заявку</h1>
    <p class="subtitle">Опишите задачу — свяжусь и уточню детали</p>

    <div class="field">
      <label class="label">Категория</label>
      <div class="chip-group" id="category-group">
        <button type="button" class="chip" data-value="Хендимен">🔧 Хендимен</button>
        <button type="button" class="chip" data-value="Техника и ПК">🖥 Техника и ПК</button>
        <button type="button" class="chip" data-value="Сайты и боты">🚀 Сайты и боты</button>
      </div>
    </div>

    <div class="field" id="subcategory-field" hidden>
      <label class="label">Что именно</label>
      <select class="select" id="subcategory" name="subcategory"></select>
    </div>

    <div class="field">
      <label class="label" for="description">Опишите проблему или задачу</label>
      <textarea
        class="textarea"
        id="description"
        name="description"
        placeholder="Например: ноутбук сильно шумит и тормозит при загрузке"
        required
      ></textarea>
    </div>

    <div class="field">
      <label class="label">Формат работы</label>
      <div class="chip-group" id="format-group">
        <button type="button" class="chip" data-value="Выезд">🚗 Выезд</button>
        <button type="button" class="chip" data-value="Удалённо">💻 Удалённо</button>
        <button type="button" class="chip" data-value="Не уверен">🤔 Не уверен</button>
      </div>
    </div>

    <div class="field" id="address-field" hidden>
      <label class="label" for="address">Адрес</label>
      <input class="input" type="text" id="address" name="address" placeholder="Район, улица" />
    </div>

    <div class="field">
      <label class="label" for="contact_phone">Телефон для связи (необязательно)</label>
      <input
        class="input"
        type="tel"
        id="contact_phone"
        name="contact_phone"
        placeholder="+381 6X XXX XXXX"
      />
    </div>

    <p class="error" id="error-text" hidden></p>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
